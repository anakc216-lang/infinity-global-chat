services:
  - type: web
    name: al-chat
    runtime: node
    buildCommand: "npm install"
    startCommand: "node server.js"
    pullRequestPreviewsEnabled: false
    envVars:
      - key: SUPABASE_URL
        value: https://rptclztrmprcxjbolkrt.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CHAT_STICKER_ALLOWED_ORIGINS
        value: https://infinity-global-chat.onrender.com,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:10000,http://127.0.0.1:10000
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_CURRENCY
        value: MYR

  - type: cron
    name: al-chat-sticker-cleanup
    runtime: node
    buildCommand: "npm install"
    startCommand: "node server.js --cleanup-chat-stickers"
    schedule: "*/5 * * * *"
    envVars:
      - key: SUPABASE_URL
        value: https://rptclztrmprcxjbolkrt.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: cron
    name: al-chat-host
    runtime: node
    buildCommand: "npm install"
    startCommand: "node server.js --chat-host-cycle"
    schedule: "* * * * *"
    envVars:
      - key: SUPABASE_URL
        value: https://rptclztrmprcxjbolkrt.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
